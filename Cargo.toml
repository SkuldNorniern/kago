[package]
name = "kago"
description = "Kago: declarative installer, packager and updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/kago"
publish = false

[features]
default = ["gui"]
# setup window on Aurea. without it kago is CLI and silent only.
gui = ["dep:aurea", "dep:sys-locale"]

[dependencies]
aurea = { git = "https://github.com/SkuldNorniern/aurea", rev = "0a45507", optional = true }
sys-locale = { version = "0.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
serde_spanned = "1"
zstd = "0.14.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tar = "0.4.46"
flate2 = "1.1.10"
png = "0.18.1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security", "Win32_System_LibraryLoader"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
