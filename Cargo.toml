[package]
name = "kago"
description = "Kago: declarative installer, packager and updater"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/kago"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
toml = "0.9"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
