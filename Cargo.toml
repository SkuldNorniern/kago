[workspace]
members = ["kago-manifest", "kago-install"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/kago"

[workspace.dependencies]
kago-manifest = { path = "kago-manifest" }
kago-install = { path = "kago-install" }

[package]
name = "kago"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kago-manifest.workspace = true
kago-install.workspace = true
