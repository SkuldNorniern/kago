# goes at the ozone repo root. build first: cargo build --release
schema = 1

[package]
id = "dev.eira.ozone"
name = "Ozone"
version = "0.1.0"
publisher = "Eira"
description = "Small command-driven text editor"
homepage = "https://github.com/SkuldNorniern/ozone"

[application]
kind = "desktop"
entrypoint = "ozone"
categories = ["Development", "TextEditor"]

[install]
scope = "user"

[[components]]
id = "core"
name = "Ozone"
required = true

[[components]]
id = "cli"
name = "Add ozone to PATH"
depends = ["core"]

[[files]]
logical_id = "ozone"
component = "core"
source = "target/release/ozone.exe"
target = "{app}/ozone.exe"
when.os = "windows"

[[files]]
logical_id = "ozone"
component = "core"
source = "target/release/ozone"
target = "{app}/bin/ozone"
when.os = "linux"

[[paths]]
resource = "ozone"
component = "cli"
when.os = ["windows", "linux"]

[[shortcuts]]
name = "Ozone"
target = "ozone"

[targets.windows]
artifacts = ["setup"]
