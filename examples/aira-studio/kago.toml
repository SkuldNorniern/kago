# goes at the aira-studio repo root. build first: cargo build --release
schema = 1

[package]
id = "dev.eira.aira-studio"
name = "Aira Studio"
version = "0.1.0"
publisher = "Eira"
description = "Set up and watch Aira trackers"

[application]
kind = "desktop"
entrypoint = "studio"

[install]
scope = "user"

[[files]]
logical_id = "studio"
source = "target/release/aira-studio.exe"
target = "{app}/aira-studio.exe"
when.os = "windows"

[[shortcuts]]
name = "Aira Studio"
target = "studio"

[targets.windows]
artifacts = ["setup"]
