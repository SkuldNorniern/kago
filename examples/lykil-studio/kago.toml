# goes at the lykil-studio repo root. build first: cargo build --release
schema = 1

[package]
id = "dev.eira.lykil-studio"
name = "Lykil Studio"
version = "0.1.0"
publisher = "Eira"
description = "Manage Lykil keyboards"
homepage = "https://github.com/SkuldNorniern/lykil"

[application]
kind = "desktop"
entrypoint = "studio"

[install]
scope = "user"

[[files]]
logical_id = "studio"
source = "target/release/lykil-studio.exe"
target = "{app}/lykil-studio.exe"
when.os = "windows"

[[shortcuts]]
name = "Lykil Studio"
target = "studio"

[targets.windows]
artifacts = ["setup"]
